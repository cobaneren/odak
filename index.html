<style>
:root {
  --bg: #ECE9E4;
  --bg-surface: #ECE9E4;
  --card: #EFECE7;
  --card2: #E6E2DC;
  --primary: #5B7083;
  --primary-light: rgba(91,112,131,0.14);
  --green: #6E8B74;
  --red: #C26D60;
  --orange: #C49363;
  --purple: #8A7CA0;
  --teal: #6B8E9B;
  --yellow: #C2AA63;
  --label: #252320;
  --label2: #48433D;
  --label3: #827C74;
  --label4: #B5AFA6;
  --separator: #D6D1C8;
  --fill: #E6E2DC;
  --fill2: #DDD8CF;
  --nav-bg: rgba(236,233,228,0.92);
  --nm-light: rgba(255,255,255,0.85);
  --nm-dark: rgba(163,157,146,0.35);
  --nm-shadow: 6px 6px 14px var(--nm-dark), -6px -6px 14px var(--nm-light);
  --nm-shadow-sm: 3px 3px 7px var(--nm-dark), -3px -3px 7px var(--nm-light);
  --nm-inset: inset 3px 3px 6px var(--nm-dark), inset -3px -3px 6px var(--nm-light);
  --nm-inset-sm: inset 2px 2px 4px var(--nm-dark), inset -2px -2px 4px var(--nm-light);
  --shadow: var(--nm-shadow);
  --shadow-sm: var(--nm-shadow-sm);
  --radius: 20px;
  --radius-sm: 14px;
  --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --font: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
::-webkit-scrollbar { width: 0; height: 0; }
html, body { background: var(--bg); }
body {
  font-family: var(--font);
  color: var(--label);
  min-height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
  padding-bottom: 90px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body > * { position: relative; z-index: 1; }

/* Doku Katmanları */
body.tex-dots::before, body.tex-lines::before, body.tex-noise::before, body.tex-grid::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: 0.55;
}
body.tex-dots::before { background-image: radial-gradient(circle at 1px 1px, rgba(120,110,95,0.22) 1px, transparent 0); background-size: 4px 4px; }
body.tex-lines::before { background-image: repeating-linear-gradient(135deg, rgba(120,110,95,0.08) 0 1px, transparent 1px 6px); }
body.tex-grid::before { background-image: linear-gradient(rgba(120,110,95,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(120,110,95,0.09) 1px, transparent 1px); background-size: 16px 16px; }
body.tex-noise::before { opacity: 0.35; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.38 0 0 0 0 0.35 0 0 0 0.45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
body.dark.tex-dots::before { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.12) 1px, transparent 0); }
body.dark.tex-lines::before { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 6px); }
body.dark.tex-grid::before { background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px); }

/* SVG İkon Sistemi */
.ui-svg {
  width: 18px; height: 18px;
  stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
  fill: none; flex-shrink: 0;
  display: inline-block; vertical-align: middle;
}

/* Üst Bar & Navigasyon */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--nav-bg); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  max-width: 430px; margin: 0 auto; width: 100%;
}
.header-clock-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; flex: 1; }
.header-clock-time {
  font-family: var(--font-display); font-size: 24px; font-weight: 700;
  letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1;
  color: color-mix(in srgb, var(--label) 65%, var(--bg));
  text-shadow: 1px 1px 0 var(--nm-light), -1px -1px 1px var(--nm-dark);
}
.header-clock-date {
  font-size: 11px; font-weight: 600; letter-spacing: 0.2px; line-height: 1;
  color: var(--label3);
}
.icon-circle-btn {
  width: 38px; height: 38px; background: var(--card); border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  color: var(--label2); box-shadow: var(--nm-shadow-sm); transition: all 0.12s;
}
.icon-circle-btn:active { box-shadow: var(--nm-inset-sm); transform: scale(0.95); color: var(--primary); }

/* Sayfalar & Tipografi */
.page { display: none; padding: 20px 16px; padding-top: calc(74px + env(safe-area-inset-top)); animation: fadeIn 0.22s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.page-title { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 22px; }
.section-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: -0.3px; margin: 8px 0 12px; }
.card, .stat-card, .chart-card, .hedef-card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  margin-bottom: 12px; box-shadow: var(--nm-shadow); border: none;
}

/* Sayaç Kartı & Zen Modu */
.timer-card {
  background: var(--card); border-radius: 26px; padding: 20px 20px 22px;
  box-shadow: var(--nm-shadow); margin-bottom: 16px; text-align: center; position: relative;
}
.timer-top-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
.tool-pill {
  background: var(--card2); box-shadow: var(--nm-shadow-sm); border: none; border-radius: 11px;
  padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--label2); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font); transition: all 0.15s;
}
.tool-pill .ui-svg { width: 15px; height: 15px; color: var(--label3); }
.tool-pill:active, .tool-pill.active { box-shadow: var(--nm-inset-sm); color: var(--primary); background: var(--primary-light); }
.tool-pill.active .ui-svg { color: var(--primary); }

.timer-mode-row {
  display: flex; background: var(--card2); box-shadow: var(--nm-inset-sm);
  border-radius: 12px; padding: 4px; margin-bottom: 16px;
}
.timer-mode-btn {
  flex: 1; border: none; background: transparent; border-radius: 9px; padding: 8px 0;
  font-size: 13px; font-weight: 600; color: var(--label3); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--font); transition: all 0.2s;
}
.timer-mode-btn .ui-svg { width: 15px; height: 15px; }
.timer-mode-btn.active { background: var(--card); box-shadow: var(--nm-shadow-sm); color: var(--label); }
.timer-mode-btn.active .ui-svg { color: var(--primary); }

.pomo-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
  border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 10px;
}
.pomo-badge.work { background: var(--primary-light); color: var(--primary); }
.pomo-badge.brk { background: rgba(110,139,116,0.18); color: var(--green); }
.pomo-cycles { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
.pomo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fill2); box-shadow: var(--nm-inset-sm); transition: all 0.3s; }
.pomo-dot.filled { background: var(--primary); box-shadow: 0 0 6px var(--primary-light); }

.pomo-adj-btn {
  width: 28px; height: 28px; border-radius: 8px; border: none; background: var(--card2);
  box-shadow: var(--nm-shadow-sm); color: var(--label); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.pomo-adj-btn:active { box-shadow: var(--nm-inset-sm); }

.timer-ring {
  width: 224px; height: 224px; margin: 0 auto 20px; position: relative;
  border-radius: 50%; background: var(--bg); box-shadow: inset 5px 5px 10px var(--nm-dark), inset -5px -5px 10px var(--nm-light);
}
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring-bg { stroke: var(--fill2); }
.ring-fill { stroke: var(--primary); stroke-dasharray: 553; stroke-dashoffset: 553; transition: stroke-dashoffset 0.35s linear; }

@keyframes timerPulse {
  0%, 100% { box-shadow: inset 5px 5px 10px var(--nm-dark), 0 0 0 0 color-mix(in srgb, var(--primary) 30%, transparent); }
  50% { box-shadow: inset 5px 5px 10px var(--nm-dark), 0 0 0 12px color-mix(in srgb, var(--primary) 0%, transparent); }
}
.timer-card.running .timer-ring { animation: timerPulse 2.4s ease-in-out infinite; }
.timer-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.timer-digits {
  font-family: var(--font-display); font-weight: 700; font-size: 42px; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--label) 70%, var(--bg));
  text-shadow: 1px 1px 0 var(--nm-light), -1px -1px 1px var(--nm-dark); line-height: 1;
}
.timer-card.running .timer-digits { color: var(--primary); }
.timer-label { font-size: 11px; color: var(--label3); margin-top: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }

.daily-progress-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--card2); box-shadow: var(--nm-inset-sm); border-radius: 12px; margin-bottom: 12px;
}
.daily-prog-label { font-size: 12px; color: var(--label3); font-weight: 600; }
.daily-prog-bar { flex: 1; height: 5px; background: var(--fill2); border-radius: 3px; overflow: hidden; }
.daily-prog-fill { height: 100%; border-radius: 3px; background: var(--primary); transition: width 0.4s ease; }
.daily-prog-val { font-size: 12px; font-weight: 700; color: var(--primary); }

.subject-selector {
  background: var(--card2); box-shadow: var(--nm-inset-sm); border-radius: 14px;
  padding: 13px 16px; display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; cursor: pointer; border: none; width: 100%; color: var(--label);
}
.subject-selector-left { display: flex; align-items: center; gap: 10px; }
.subject-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
.subject-name { font-size: 15px; font-weight: 600; }
.subject-chevron { color: var(--label3); display: flex; }

.btn-row { display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 15px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600;
  font-family: var(--font); cursor: pointer; transition: all 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary {
  background: var(--primary); color: white;
  box-shadow: 0 -2px 0 rgba(0,0,0,0.25) inset, 0 4px 10px color-mix(in srgb, var(--primary) 35%, transparent);
}
.btn-primary:active { transform: scale(0.98) translateY(1px); }
.btn-secondary { background: var(--card); color: var(--label); box-shadow: var(--nm-shadow-sm); }
.btn-secondary:active { box-shadow: var(--nm-inset-sm); transform: translateY(1px); }
.btn-danger {
  background: var(--red); color: white;
  box-shadow: 0 -2px 0 rgba(0,0,0,0.25) inset, 0 4px 10px color-mix(in srgb, var(--red) 35%, transparent);
}

/* Zen Modu Kuralları */
body.zen-mode .app-header, body.zen-mode .bottom-nav, body.zen-mode .daily-progress-row,
body.zen-mode .subject-selector, body.zen-mode #pomoSetRow, body.zen-mode .timer-mode-row,
body.zen-mode #page-sayac > div:not(#timerCard) {
  opacity: 0 !important; pointer-events: none !important; height: 0 !important;
  margin: 0 !important; padding: 0 !important; overflow: hidden !important;
}
body.zen-mode #page-sayac { display: flex !important; flex-direction: column; justify-content: center; min-height: 100dvh; padding-top: 20px !important; }
body.zen-mode .timer-card { padding: 40px 24px !important; }
body.zen-mode .timer-ring { width: 260px !important; height: 260px !important; margin-bottom: 28px !important; }

/* Geçmiş & Dersler */
.history-item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--separator); cursor: pointer; }
.history-item:last-child { border-bottom: none; }
.history-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
.history-info { flex: 1; min-width: 0; }
.history-subject { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-time { font-size: 12px; color: var(--label3); margin-top: 2px; }
.history-duration { font-size: 13px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 5px 10px; border-radius: 10px; }

.dersler-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.add-btn {
  width: 38px; height: 38px; background: var(--primary); color: white; border: none;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 3px 8px color-mix(in srgb, var(--primary) 40%, transparent);
}
.ders-item {
  display: flex; align-items: center; gap: 14px; padding: 14px;
  background: linear-gradient(105deg, color-mix(in srgb, var(--card) 93%, var(--ders-tint, var(--primary))), var(--card) 65%);
  border-radius: var(--radius); margin-bottom: 10px; box-shadow: var(--nm-shadow-sm);
}
.ders-color-bar { width: 6px; height: 46px; border-radius: 4px; flex-shrink: 0; }
.ders-info { flex: 1; }
.ders-name { font-size: 16px; font-weight: 600; }
.ders-stats { font-size: 13px; color: var(--label3); margin-top: 3px; }
.ders-actions { display: flex; gap: 8px; }
.ders-action-btn {
  width: 34px; height: 34px; border: none; border-radius: 10px; background: var(--card);
  box-shadow: var(--nm-shadow-sm); color: var(--label2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.ders-action-btn:active { box-shadow: var(--nm-inset-sm); }
.ders-action-btn.del:active { color: var(--red); }

/* İstatistikler & Heatmap */
.stats-toggle, .cal-view-toggle {
  display: flex; background: var(--card2); border-radius: var(--radius-sm);
  padding: 4px; margin-bottom: 18px; box-shadow: var(--nm-inset-sm); gap: 4px;
}
.stats-tab, .cal-vtab {
  flex: 1; padding: 9px 4px; border: none; background: transparent; border-radius: 10px;
  font-size: 13px; font-weight: 600; color: var(--label3); cursor: pointer;
  font-family: var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.stats-tab.active, .cal-vtab.active { background: var(--card); color: var(--label); box-shadow: var(--nm-shadow-sm); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-icon {
  width: 38px; height: 38px; border-radius: 12px; background: var(--primary-light);
  color: var(--primary); display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px; box-shadow: var(--nm-inset-sm);
}
.stat-value { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.8px; }
.stat-label { font-size: 12px; color: var(--label3); margin-top: 3px; font-weight: 500; }

.chart-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.chart-title .ui-svg { color: var(--primary); }
.bar-chart-wrap { display: flex; }
.bar-chart-yaxis { display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 20px; margin-right: 8px; }
.bar-chart-yaxis span { font-size: 10px; color: var(--label3); text-align: right; }
.bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 130px; flex: 1; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; }
.bar-wrap { flex: 1; display: flex; align-items: flex-end; width: 100%; justify-content: center; }
.bar-day { font-size: 10px; color: var(--label3); font-weight: 500; }
.bar-day.today { color: var(--primary); font-weight: 800; }

.subject-time-item { margin-bottom: 14px; }
.subject-time-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.subject-time-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.subject-time-dot { width: 10px; height: 10px; border-radius: 50%; }
.subject-time-val { font-size: 13px; color: var(--label3); font-weight: 600; }
.subject-progress { height: 6px; background: var(--fill2); box-shadow: var(--nm-inset-sm); border-radius: 3px; overflow: hidden; }
.subject-progress-fill { height: 100%; border-radius: 3px; }

.streak-card {
  background: linear-gradient(135deg, var(--orange), var(--red)); border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 14px; color: white; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--red) 30%, transparent);
}
.streak-icon { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
.streak-val { font-size: 22px; font-weight: 800; }
.streak-label { font-size: 12px; opacity: 0.9; margin-top: 2px; }

.heatmap-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; margin-top: 10px; }
.heatmap-col { display: flex; flex-direction: column; gap: 5px; }
.heatmap-cell { aspect-ratio: 1; border-radius: 4px; background: var(--fill2); box-shadow: var(--nm-inset-sm); }
.heatmap-legend { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 10px; font-size: 11px; color: var(--label3); }
.heatmap-legend-box { width: 10px; height: 10px; border-radius: 3px; }
.summary-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--separator); }
.summary-row:last-child { border-bottom: none; }
.summary-label { font-size: 14px; color: var(--label2); display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.summary-label .ui-svg { color: var(--primary); width: 16px; height: 16px; }
.summary-val { font-size: 15px; font-weight: 700; }

/* Hedefler */
.hedef-card { position: relative; overflow: hidden; padding: 20px; }
.hedef-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--primary); }
.hedef-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.hedef-title-row { display: flex; align-items: center; gap: 10px; }
.hedef-icon { width: 36px; height: 3
<script>

const unifiedPicker = {
  h: 210, s: 0.8, b: 0.9, hex: '#007AFF', bound: false,
  hsbToRgb(h,s,b) {
    const k = n => (n + h/60) % 6;
    const f = n => b - b * s * Math.max(0, Math.min(k(n), 4 - k(n), 1));
    return [Math.round(f(5)*255), Math.round(f(3)*255), Math.round(f(1)*255)];
  },
  rgbToHex(r,g,b) { return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join(''); },
  hexToHsb(hex) {
    hex = hex.replace('#',''); if (hex.length !== 6) return null;
    const r=parseInt(hex.slice(0,2),16)/255, g=parseInt(hex.slice(2,4),16)/255, b=parseInt(hex.slice(4,6),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    let h = 0;
    if (d) { h = max===r ? ((g-b)/d+6)%6 : max===g ? (b-r)/d+2 : (r-g)/d+4; h *= 60; }
    return { h, s: max ? d/max : 0, b: max };
  },
  open(initialHex) {
    this.hex = initialHex || '#007AFF';
    const hsb = this.hexToHsb(this.hex);
    if (hsb) { this.h = hsb.h; this.s = hsb.s; this.b = hsb.b; }
    document.getElementById('cpSwatchRow').innerHTML = SWATCHES.map(c =>
      `<div class="swatch ${c.toLowerCase()===this.hex.toLowerCase()?'active':''}" style="background:${c}" onclick="unifiedPicker.fromHex('${c}')"></div>`
    ).join('');
    this.bindEvents();
    setTimeout(() => this.render(), 60);
  },
  fromHex(val) {
    val = val.trim(); if (!val.startsWith('#')) val = '#' + val;
    if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
      const hsb = this.hexToHsb(val);
      if (hsb) { this.h = hsb.h; this.s = hsb.s; this.b = hsb.b; this.render(); }
    }
  },
  render() {
    const canvas = document.getElementById('cpSbCanvas'); if (!canvas) return;
    const ctx = canvas.getContext('2d'), W = 400, H = 150;
    canvas.width = W; canvas.height = H;
    const [hr,hg,hb] = this.hsbToRgb(this.h, 1, 1);
    ctx.fillStyle = `rgb(${hr},${hg},${hb})`; ctx.fillRect(0,0,W,H);
    const gW = ctx.createLinearGradient(0,0,W,0); gW.addColorStop(0,'#fff'); gW.addColorStop(1,'transparent');
    ctx.fillStyle = gW; ctx.fillRect(0,0,W,H);
    const gB = ctx.createLinearGradient(0,0,0,H); gB.addColorStop(0,'transparent'); gB.addColorStop(1,'#000');
    ctx.fillStyle = gB; ctx.fillRect(0,0,W,H);

    const [r,g,b] = this.hsbToRgb(this.h, this.s, this.b);
    this.hex = this.rgbToHex(r,g,b);
    document.getElementById('cpSbThumb').style.left = (this.s*100)+'%';
    document.getElementById('cpSbThumb').style.top = ((1-this.b)*100)+'%';
    document.getElementById('cpHueThumb').style.left = (this.h/360*100)+'%';
    document.getElementById('cpHueThumb').style.background = `rgb(${hr},${hg},${hb})`;
    document.getElementById('cpCircle').style.background = this.hex;
    document.getElementById('cpHex').value = this.hex.toUpperCase();
  },
  bindEvents() {
    if (this.bound) return; this.bound = true;
    const wrap = document.getElementById('cpSbWrap'), track = document.getElementById('cpHueTrack');
    const moveSB = e => {
      const rect = wrap.getBoundingClientRect(), pt = e.touches ? e.touches[0] : e;
      this.s = Math.max(0, Math.min(1, (pt.clientX - rect.left)/rect.width));
      this.b = Math.max(0, Math.min(1, 1 - (pt.clientY - rect.top)/rect.height));
      this.render();
    };
    const moveH = e => {
      const rect = track.getBoundingClientRect(), pt = e.touches ? e.touches[0] : e;
      this.h = Math.max(0, Math.min(360, ((pt.clientX - rect.left)/rect.width)*360));
      this.render();
    };
    wrap.addEventListener('pointerdown', e => { wrap.setPointerCapture(e.pointerId); moveSB(e); wrap.onpointermove = moveSB; wrap.onpointerup = () => wrap.onpointermove = null; });
    track.addEventListener('pointerdown', e => { track.setPointerCapture(e.pointerId); moveH(e); track.onpointermove = moveH; track.onpointerup = () => track.onpointermove = null; });
  }
};

function applyTheme() {
  const variant = themeSettings.bgVariant || 'paper';
  const bgHex = variant === 'custom' ? (themeSettings.customBgHex || '#ECE9E4') : (BG_PRESETS[variant] || '#ECE9E4');
  const r = parseInt(bgHex.slice(1,3),16), g = parseInt(bgHex.slice(3,5),16), b = parseInt(bgHex.slice(5,7),16);
  const luma = 0.2126*r + 0.7152*g + 0.0722*b;
  const isDark = luma < 110;
  document.body.classList.toggle('dark', isDark);

  const clamp = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2,'0');
  const shift = d => '#' + clamp(r+d) + clamp(g+d) + clamp(b+d);

  const s = document.body.style;
  s.setProperty('--bg', bgHex);
  s.setProperty('--card', shift(isDark ? 9 : 6));
  s.setProperty('--card2', shift(isDark ? 16 : -8));
  s.setProperty('--fill', shift(isDark ? 16 : -8));
  s.setProperty('--fill2', shift(isDark ? 22 : -15));
  s.setProperty('--separator', shift(isDark ? 24 : -22));
  s.setProperty('--label', isDark ? '#F2EFE9' : '#252320');
  s.setProperty('--label2', isDark ? '#C8C4BC' : '#48433D');
  s.setProperty('--label3', isDark ? '#8A867E' : '#7E7870');
  s.setProperty('--label4', isDark ? '#4A4742' : '#B8B2A8');
  s.setProperty('--nav-bg', hexAlpha(bgHex, 0.92));
  s.setProperty('--nm-light', isDark ? hexAlpha(shift(24), 0.45) : 'rgba(255,255,255,0.85)');
  s.setProperty('--nm-dark', isDark ? 'rgba(0,0,0,0.58)' : hexAlpha(shift(-52), 0.25));

  const acc = themeSettings.accentHex || '#4A6B82';
  s.setProperty('--primary', acc);
  s.setProperty('--primary-light', hexAlpha(acc, isDark ? 0.22 : 0.14));

  document.documentElement.style.background = bgHex;
  const meta = document.getElementById('metaThemeColor');
  if (meta) meta.content = bgHex;

  document.querySelectorAll('.bg-picker-opt').forEach(el => el.classList.toggle('active', el.dataset.bg === variant));
  ['none','dots','lines','grid','noise'].forEach(t => document.body.classList.remove('tex-' + t));
  if (themeSettings.texVariant && themeSettings.texVariant !== 'none') document.body.classList.add('tex-' + themeSettings.texVariant);
  document.querySelectorAll('.tex-picker-opt').forEach(el => el.classList.toggle('active', el.dataset.tex === (themeSettings.texVariant || 'none')));

  buildAccentChips();
  localStorage.setItem('dersTheme', JSON.stringify(themeSettings));
}

let _audioCtx = null, _noiseNode = null, _currentNoise = 'off';
function getAudioCtx() {
  if (!_audioCtx || _audioCtx.state === 'closed') _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}
function playTone(freq, delay, dur, vol=0.2) {
  if (!state.pomodoroSound) return;
  try {
    const ctx = getAudioCtx(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + delay;
    g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.start(t); o.stop(t+dur+0.04);
  } catch(e) {}
}
function haptic(ms=12) { if (state.pomodoroVibe && navigator.vibrate) try { navigator.vibrate(ms); } catch(e) {} }

function cycleAmbientNoise(btn) {
  const modes = ['off', 'brown', 'rain'];
  const names = { off: 'Ortam Sesi', brown: 'Derin Odak', rain: 'Yağmur' };
  _currentNoise = modes[(modes.indexOf(_currentNoise) + 1) % modes.length];
  btn.querySelector('span').textContent = names[_currentNoise];
  btn.classList.toggle('active', _currentNoise !== 'off');
  if (_currentNoise === 'off') {
    if (_noiseNode) { try { _noiseNode.stop(); _noiseNode.disconnect(); } catch(e) {} _noiseNode = null; }
  } else {
    if (_noiseNode) { try { _noiseNode.stop(); _noiseNode.disconnect(); } catch(e) {} }
    try {
      const ctx = getAudioCtx(), buf = ctx.createBuffer(1, 2*ctx.sampleRate, ctx.sampleRate), out = buf.getChannelData(0);
      let last = 0;
      for (let i=0; i<out.length; i++) {
        const w = Math.random()*2 - 1;
        out[i] = _currentNoise === 'brown' ? ((last + 0.02*w)/1.02)*3.2 : ((last + 0.08*w)/1.08)*1.6;
        last = out[i] / (_currentNoise === 'brown' ? 3.2 : 1.6);
      }
      _noiseNode = ctx.createBufferSource(); _noiseNode.buffer = buf; _noiseNode.loop = true;
      const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = _currentNoise === 'brown' ? 400 : 1100;
      const gn = ctx.createGain(); gn.gain.value = 0.16;
      _noiseNode.connect(flt); flt.connect(gn); gn.connect(ctx.destination); _noiseNode.start();
    } catch(e) {}
  }
}
